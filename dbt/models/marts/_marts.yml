version: 2

models:
  - name: dim_players
    description: "Dimensão consolidada de jogadores"
    columns:
      - name: player_id
        description: "Primary key for players"
        tests:
          - unique
          - not_null

  - name: dim_teams
    description: "Dimensão consolidada de times, unificando clubes e seleções"
    columns:
      - name: team_id
        description: "Primary key for teams"
        tests:
          - unique
          - not_null

  - name: fct_games
    description: "Tabela fato com o resumo de cada partida"
    columns:
      - name: game_id
        description: "Primary key for games"
        tests:
          - unique
          - not_null
      - name: home_team_id
        description: "Foreign key for home team"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: away_team_id
        description: "Foreign key for away team"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: home_team_goals_excl_shootout
        description: "Home-team goals excluding penalty-shootout conversions; null when event data is unavailable"
      - name: away_team_goals_excl_shootout
        description: "Away-team goals excluding penalty-shootout conversions; null when event data is unavailable"
      - name: home_team_shootout_goals
        description: "Successful home-team penalty-shootout conversions"
      - name: away_team_shootout_goals
        description: "Successful away-team penalty-shootout conversions"
      - name: event_data_available
        description: "Whether the source contains event data for the game"
      - name: went_to_shootout
        description: "Whether the event data identifies a penalty shootout"
      - name: score_reconciled
        description: "Whether event goals reconcile with the score after removing shootout conversions"
      - name: score_format
        description: "How the source score relates to shootout conversions: no_shootout, includes_shootout, excludes_shootout, unreconciled_shootout, or no_event_data"
        tests:
          - accepted_values:
              arguments:
                values:
                  - no_shootout
                  - includes_shootout
                  - excludes_shootout
                  - unreconciled_shootout
                  - no_event_data
      - name: game_result_excl_shootout
        description: "Result after regular and extra time, excluding the penalty shootout"

  - name: fct_appearances
    description: "Tabela fato de aparições detalhando a atuação de cada jogador na partida"
    columns:
      - name: appearance_id
        description: "Primary key for appearances"
        tests:
          - unique
          - not_null
      - name: player_id
        description: "Foreign key for player"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: game_id
        description: "Foreign key for game"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id

  - name: fct_team_games_enriched
    description: "Uma linha por time e partida, com resultados e métricas pela perspectiva do time"
    columns:
      - name: game_id
        description: "Partida representada pela perspectiva do time"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games')
                field: game_id
      - name: competition_id
        description: "Competição da partida"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_competitions')
                field: competition_id
      - name: team_id
        description: "Time cuja perspectiva a linha representa"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: opponent_id
        description: "Adversário do time na partida"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_id
      - name: venue
        description: "Mando de campo pela perspectiva do time"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - home
                  - away
      - name: goals_for
        description: "Gols do time, excluindo cobranças de disputa por pênaltis quando identificáveis"
        tests:
          - not_null
      - name: goals_against
        description: "Gols do adversário, excluindo cobranças de disputa por pênaltis quando identificáveis"
        tests:
          - not_null
      - name: result
        description: "Resultado pela perspectiva do time"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - win
                  - draw
                  - loss
      - name: points
        description: "Pontos conquistados pelo time na partida"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 0
                  - 1
                  - 3
