name: football_data_platform
version: "1.0.0"
config-version: 2

profile: football_data_platform

model-paths:
  - models

analysis-paths:
  - analyses

test-paths:
  - tests

seed-paths:
  - seeds

macro-paths:
  - macros

snapshot-paths:
  - snapshots

clean-targets:
  - target
  - dbt_packages
  - logs

models:
  football_data_platform:
    staging:
      +schema: staging
      +materialized: view
      +tags:
        - staging

    core:
      +schema: core
      +materialized: table
      +tags:
        - core

    marts:
      +schema: marts
      +materialized: table
      +tags:
        - marts
