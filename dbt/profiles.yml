football_data_platform:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  outputs:
    dev:
      type: postgres
      host: "{{ env_var('FOOTBALL_DB_HOST', 'football-db') }}"
      port: "{{ env_var('FOOTBALL_DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('FOOTBALL_DB_NAME', 'football') }}"
      user: "{{ env_var('FOOTBALL_DB_USER', 'football') }}"
      password: "{{ env_var('FOOTBALL_DB_PASSWORD') }}"
      schema: staging
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 10
      retries: 2
      keepalives_idle: 0
      sslmode: "{{ env_var('FOOTBALL_DB_SSLMODE', 'disable') }}"
