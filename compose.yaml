name: football-data-platform

x-runtime-environment: &runtime-environment
  APP_ENV: ${APP_ENV:-development}
  TZ: ${TZ:-America/Araguaina}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

  DATASET_HANDLE: ${DATASET_HANDLE:-davidcariboo/player-scores}
  RAW_DATA_DIR: /app/data/raw
  KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}

  DBT_PROJECT_DIR: /app/dbt
  DBT_PROFILES_DIR: /app/dbt
  DBT_TARGET: ${DBT_TARGET:-dev}
  DBT_THREADS: ${DBT_THREADS:-4}

  FOOTBALL_DB_HOST: football-db
  FOOTBALL_DB_PORT: "5432"
  FOOTBALL_DB_NAME: ${FOOTBALL_DB_NAME:-football}
  FOOTBALL_DB_USER: ${FOOTBALL_DB_USER:-football}
  FOOTBALL_DB_PASSWORD: ${FOOTBALL_DB_PASSWORD:?Defina FOOTBALL_DB_PASSWORD no arquivo .env}
  FOOTBALL_DB_SSLMODE: disable

x-app-volumes: &app-volumes
  - type: bind
    source: ./data
    target: /app/data
  - type: bind
    source: ./dbt
    target: /app/dbt
  - type: bind
    source: ./scripts
    target: /app/scripts
    read_only: true
  - type: bind
    source: ./tests
    target: /app/tests
    read_only: true
  - type: bind
    source: ./notebooks
    target: /app/notebooks
  - type: bind
    source: ./logs
    target: /app/logs

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12.13}
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
  image: football-data-platform:${APP_VERSION:-dev}
  working_dir: /app
  init: true
  environment:
    <<: *runtime-environment
  volumes: *app-volumes
  networks:
    - football-network
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=2g,mode=1777
  shm_size: 1gb
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
  restart: "no"

x-superset-environment: &superset-environment
  TZ: ${TZ:-America/Araguaina}
  PYTHONUNBUFFERED: "1"
  SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  SUPERSET_HOME: /app/superset_home
  SUPERSET_ENV: production
  FLASK_ENV: production

  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Defina SUPERSET_SECRET_KEY no arquivo .env}

  SUPERSET_DB_HOST: superset-db
  SUPERSET_DB_PORT: "5432"
  SUPERSET_DB_NAME: ${SUPERSET_DB_NAME:-superset}
  SUPERSET_DB_USER: ${SUPERSET_DB_USER:-superset}
  SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?Defina SUPERSET_DB_PASSWORD no arquivo .env}

  SUPERSET_REDIS_HOST: superset-redis
  SUPERSET_REDIS_PORT: "6379"
  SUPERSET_REDIS_PASSWORD: ${SUPERSET_REDIS_PASSWORD:?Defina SUPERSET_REDIS_PASSWORD no arquivo .env}

  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
  SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Football}
  SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-Admin}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Defina SUPERSET_ADMIN_PASSWORD no arquivo .env}

  SUPERSET_WEBSERVER_WORKERS: ${SUPERSET_WEBSERVER_WORKERS:-2}
  SUPERSET_WEBSERVER_THREADS: ${SUPERSET_WEBSERVER_THREADS:-20}
  SUPERSET_WEBSERVER_TIMEOUT: ${SUPERSET_WEBSERVER_TIMEOUT:-120}
  SUPERSET_CELERY_WORKERS: ${SUPERSET_CELERY_WORKERS:-2}
  SUPERSET_LOG_LEVEL: ${SUPERSET_LOG_LEVEL:-INFO}

  # Disponibilizadas para automação futura do cadastro da conexão.
  FOOTBALL_DB_HOST: football-db
  FOOTBALL_DB_PORT: "5432"
  FOOTBALL_DB_NAME: ${FOOTBALL_DB_NAME:-football}
  FOOTBALL_DB_USER: ${FOOTBALL_DB_USER:-football}
  FOOTBALL_DB_PASSWORD: ${FOOTBALL_DB_PASSWORD:?Defina FOOTBALL_DB_PASSWORD no arquivo .env}

x-superset-volumes: &superset-volumes
  - type: volume
    source: superset-home
    target: /app/superset_home

x-superset-base: &superset-base
  build:
    context: .
    dockerfile: docker/superset/Dockerfile
    args:
      SUPERSET_VERSION: ${SUPERSET_VERSION:-6.0.0}
  init: true
  environment:
    <<: *superset-environment
  volumes: *superset-volumes
  networks:
    - football-network
    - superset-backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=1g,mode=1777
  shm_size: 1gb
  stop_grace_period: 60s
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  # ============================================================
  # Warehouse PostgreSQL
  #
  # PostgreSQL 18+ usa /var/lib/postgresql como ponto de volume.
  # O cluster fica no subdiretório versionado 18/docker.
  # ============================================================
  football-db:
    image: postgres:${FOOTBALL_DB_VERSION:-18.4}-alpine
    environment:
      POSTGRES_DB: ${FOOTBALL_DB_NAME:-football}
      POSTGRES_USER: ${FOOTBALL_DB_USER:-football}
      POSTGRES_PASSWORD: ${FOOTBALL_DB_PASSWORD:?Defina FOOTBALL_DB_PASSWORD no arquivo .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: ${TZ:-America/Araguaina}
      PGTZ: ${TZ:-America/Araguaina}
    command:
      - postgres
      - -c
      - max_connections=${FOOTBALL_DB_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${FOOTBALL_DB_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${FOOTBALL_DB_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - maintenance_work_mem=${FOOTBALL_DB_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - work_mem=${FOOTBALL_DB_WORK_MEM:-8MB}
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=${FOOTBALL_DB_MAX_WAL_SIZE:-2GB}
      - -c
      - checkpoint_timeout=${FOOTBALL_DB_CHECKPOINT_TIMEOUT:-15min}
    volumes:
      - type: volume
        source: football-postgres-data
        target: /var/lib/postgresql
      - type: bind
        source: ./docker/postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    expose:
      - "5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - football-network
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    cpus: ${FOOTBALL_DB_CPUS:-4.0}
    mem_limit: ${FOOTBALL_DB_MEMORY:-4g}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # ============================================================
  # Pipeline completo
  # download -> carga raw -> dbt build/test
  # ============================================================
  pipeline:
    <<: *app-base
    profiles: [jobs]
    depends_on:
      football-db:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -Eeuo pipefail

        echo "==> Baixando dataset"
        python scripts/download_data.py

        echo "==> Carregando schema raw no PostgreSQL"
        python scripts/load_raw.py

        echo "==> Instalando dependências dbt"
        dbt deps \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}"

        echo "==> Validando conexão dbt"
        dbt debug \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}" \
          --target "$${DBT_TARGET}"

        echo "==> Executando modelos e testes dbt"
        dbt build \
          --full-refresh \
          --fail-fast \
          --threads "$${DBT_THREADS}" \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}" \
          --target "$${DBT_TARGET}"

        echo "==> Pipeline concluído"
    cpus: ${PIPELINE_CPUS:-4.0}
    mem_limit: ${PIPELINE_MEMORY:-8g}

  # ============================================================
  # Jobs individuais
  # ============================================================
  download:
    <<: *app-base
    profiles: [jobs]
    command: [python, scripts/download_data.py]
    cpus: ${DOWNLOAD_CPUS:-2.0}
    mem_limit: ${DOWNLOAD_MEMORY:-4g}

  download-force:
    <<: *app-base
    profiles: [jobs]
    command: [python, scripts/download_data.py, --force]
    cpus: ${DOWNLOAD_CPUS:-2.0}
    mem_limit: ${DOWNLOAD_MEMORY:-4g}

  load-raw:
    <<: *app-base
    profiles: [jobs]
    depends_on:
      football-db:
        condition: service_healthy
    command: [python, scripts/load_raw.py]
    cpus: ${PIPELINE_CPUS:-4.0}
    mem_limit: ${PIPELINE_MEMORY:-8g}

  dbt-build:
    <<: *app-base
    profiles: [jobs]
    depends_on:
      football-db:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -Eeuo pipefail
        dbt deps \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}"
        dbt build \
          --full-refresh \
          --fail-fast \
          --threads "$${DBT_THREADS}" \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}" \
          --target "$${DBT_TARGET}"
    cpus: ${PIPELINE_CPUS:-4.0}
    mem_limit: ${PIPELINE_MEMORY:-8g}

  dbt-test:
    <<: *app-base
    profiles: [jobs]
    depends_on:
      football-db:
        condition: service_healthy
    command:
      - dbt
      - test
      - --threads
      - "$${DBT_THREADS}"
      - --project-dir
      - "$${DBT_PROJECT_DIR}"
      - --profiles-dir
      - "$${DBT_PROFILES_DIR}"
      - --target
      - "$${DBT_TARGET}"
    cpus: ${TEST_CPUS:-2.0}
    mem_limit: ${TEST_MEMORY:-4g}

  python-test:
    <<: *app-base
    profiles: [quality]
    command: [pytest, -v, --tb=short, /app/tests]
    cpus: ${TEST_CPUS:-2.0}
    mem_limit: ${TEST_MEMORY:-4g}

  lint:
    <<: *app-base
    profiles: [quality]
    depends_on:
      football-db:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -Eeuo pipefail
        ruff check scripts tests
        ruff format --check scripts tests
        dbt parse \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}" \
          --target "$${DBT_TARGET}"
    cpus: ${TEST_CPUS:-2.0}
    mem_limit: ${TEST_MEMORY:-4g}

  # ============================================================
  # Ferramentas interativas
  # ============================================================
  shell:
    <<: *app-base
    profiles: [tools]
    command: [bash]
    stdin_open: true
    tty: true

  football-psql:
    image: postgres:${FOOTBALL_DB_VERSION:-18.4}-alpine
    profiles: [tools]
    depends_on:
      football-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${FOOTBALL_DB_PASSWORD:?Defina FOOTBALL_DB_PASSWORD no arquivo .env}
      PGHOST: football-db
      PGPORT: "5432"
      PGDATABASE: ${FOOTBALL_DB_NAME:-football}
      PGUSER: ${FOOTBALL_DB_USER:-football}
    command: [psql]
    stdin_open: true
    tty: true
    networks:
      - football-network
    security_opt:
      - no-new-privileges:true
    restart: "no"

  jupyter:
    <<: *app-base
    profiles: [development]
    depends_on:
      football-db:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        exec jupyter lab \
          --ip=0.0.0.0 \
          --port=8888 \
          --no-browser \
          --ServerApp.root_dir=/app \
          --ServerApp.token="$${JUPYTER_TOKEN}" \
          --ServerApp.allow_remote_access=true \
          --ServerApp.disable_check_xsrf=false
    environment:
      <<: *runtime-environment
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-football-local}
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8888/api/status', timeout=5)" || exit 1
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    cpus: ${JUPYTER_CPUS:-4.0}
    mem_limit: ${JUPYTER_MEMORY:-8g}
    restart: unless-stopped

  # ============================================================
  # Documentação dbt
  # ============================================================
  dbt-docs:
    <<: *app-base
    profiles: [documentation]
    depends_on:
      football-db:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -Eeuo pipefail
        dbt docs generate \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}" \
          --target "$${DBT_TARGET}"
        exec dbt docs serve \
          --project-dir "$${DBT_PROJECT_DIR}" \
          --profiles-dir "$${DBT_PROFILES_DIR}" \
          --target "$${DBT_TARGET}" \
          --host 0.0.0.0 \
          --port 8080 \
          --no-browser
    ports:
      - "127.0.0.1:${DBT_DOCS_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=5)" || exit 1
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    cpus: ${DOCS_CPUS:-1.0}
    mem_limit: ${DOCS_MEMORY:-2g}
    restart: unless-stopped

  # ============================================================
  # Superset - metastore PostgreSQL
  # Superset 6.0 documenta suporte oficial até PostgreSQL 16.
  # ============================================================
  superset-db:
    image: postgres:${SUPERSET_POSTGRES_VERSION:-16.14}-alpine
    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?Defina SUPERSET_DB_PASSWORD no arquivo .env}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-America/Araguaina}
      PGTZ: ${TZ:-America/Araguaina}
    volumes:
      - type: volume
        source: superset-postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - superset-backend
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # ============================================================
  # Superset - cache, broker Celery e resultados assíncronos
  # ============================================================
  superset-redis:
    image: redis:${SUPERSET_REDIS_VERSION:-8.8.0}-alpine
    environment:
      SUPERSET_REDIS_PASSWORD: ${SUPERSET_REDIS_PASSWORD:?Defina SUPERSET_REDIS_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Araguaina}
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --save 60 1000 \
          --requirepass "$${SUPERSET_REDIS_PASSWORD}"
    volumes:
      - type: volume
        source: superset-redis-data
        target: /data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${SUPERSET_REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - superset-backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  # ============================================================
  # Migrações, permissões e usuário administrador
  # ============================================================
  superset-init:
    <<: *superset-base
    command: [/app/docker/init.sh]
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    restart: "no"

  # ============================================================
  # Aplicação web Superset
  # ============================================================
  superset-web:
    <<: *superset-base
    command:
      - bash
      - -lc
      - |
        exec /app/.venv/bin/gunicorn \
          --bind 0.0.0.0:8088 \
          --access-logfile - \
          --error-logfile - \
          --workers "$${SUPERSET_WEBSERVER_WORKERS}" \
          --worker-class gthread \
          --threads "$${SUPERSET_WEBSERVER_THREADS}" \
          --timeout "$${SUPERSET_WEBSERVER_TIMEOUT}" \
          --keep-alive 5 \
          --max-requests 1000 \
          --max-requests-jitter 100 \
          "superset.app:create_app()"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)" || exit 1
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 45s
    cpus: ${SUPERSET_WEB_CPUS:-2.0}
    mem_limit: ${SUPERSET_WEB_MEMORY:-3g}
    restart: unless-stopped

  # ============================================================
  # Worker para SQL Lab assíncrono e tarefas de background
  # ============================================================
  superset-worker:
    <<: *superset-base
    command:
      - bash
      - -lc
      - |
        exec /app/.venv/bin/celery \
          --app=superset.tasks.celery_app:app \
          worker \
          --pool=prefork \
          -O fair \
          --concurrency="$${SUPERSET_CELERY_WORKERS}" \
          --loglevel="$${SUPERSET_LOG_LEVEL}"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - /app/.venv/bin/celery --app=superset.tasks.celery_app:app inspect ping -d "celery@$${HOSTNAME}" --timeout=5 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    cpus: ${SUPERSET_WORKER_CPUS:-2.0}
    mem_limit: ${SUPERSET_WORKER_MEMORY:-3g}
    restart: unless-stopped

  # ============================================================
  # Scheduler Celery. Deve existir exatamente uma instância.
  # ============================================================
  superset-beat:
    <<: *superset-base
    profiles: [superset-scheduler]
    command:
      - bash
      - -lc
      - |
        exec /app/.venv/bin/celery \
          --app=superset.tasks.celery_app:app \
          beat \
          --loglevel="$${SUPERSET_LOG_LEVEL}" \
          --pidfile=/app/superset_home/celerybeat.pid \
          --schedule=/app/superset_home/celerybeat-schedule
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    cpus: ${SUPERSET_BEAT_CPUS:-0.5}
    mem_limit: ${SUPERSET_BEAT_MEMORY:-1g}
    restart: unless-stopped

networks:
  football-network:
    name: football-data-network
    driver: bridge
  superset-backend:
    name: football-superset-backend
    driver: bridge
    internal: true

volumes:
  football-postgres-data:
    name: football-postgres-data
  superset-postgres-data:
    name: football-superset-postgres-data
  superset-redis-data:
    name: football-superset-redis-data
  superset-home:
    name: football-superset-home
